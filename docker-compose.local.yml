version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: eseller-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: E-Seller2024
      POSTGRES_DB: eseller
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # N8N Automation
  n8n:
    image: n8nio/n8n
    container_name: eseller-n8n
    depends_on:
      db:
        condition: service_healthy
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - WEBHOOK_URL=http://n8n:5678
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=db
      - DB_POSTGRESDB_DATABASE=eseller
      - DB_POSTGRESDB_USER=postgres
      - DB_POSTGRESDB_PASSWORD=E-Seller2024
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  postgres_data:
  n8n_data: