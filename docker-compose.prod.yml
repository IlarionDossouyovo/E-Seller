version: '3.8'

services:
  # Next.js Application
  nextjs:
    build: .
    container_name: e-seller-nextjs
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://eseller:eseller_password@postgres:5432/eseller
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=eseller
      - POSTGRES_PASSWORD=eseller_password
      - POSTGRES_DB=eseller
    depends_on:
      postgres:
        condition: service_healthy

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: e-seller-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eseller
      POSTGRES_PASSWORD: eseller_password
      POSTGRES_DB: eseller
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eseller"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama (AI Local)
  ollama:
    image: ollama/ollama:latest
    container_name: e-seller-ollama
    restart: unless-stopped
    ports:
      - "11435:11434"
    volumes:
      - ollama_data_prod:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: e-seller-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nextjs

volumes:
  postgres_data_prod:
  ollama_data_prod:
