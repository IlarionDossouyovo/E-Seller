version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: e-seller-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eseller
      POSTGRES_PASSWORD: eseller_password
      POSTGRES_DB: eseller
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eseller"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama (AI Local)
  ollama:
    image: ollama/ollama:latest
    container_name: e-seller-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0

  # N8n (Automation)
  n8n:
    image: n8nio/n8n:latest
    container_name: e-seller-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=eseller_n8n
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=eseller
      - DB_POSTGRESDB_USER=eseller
      - DB_POSTGRESDB_PASSWORD=eseller_password
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  ollama_data:
  n8n_data: