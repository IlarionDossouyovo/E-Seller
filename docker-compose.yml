version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: e-seller-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eseller
      POSTGRES_PASSWORD: eseller_password
      POSTGRES_DB: eseller
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eseller"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama (AI Local)
  ollama:
    image: ollama/ollama:latest
    container_name: e-seller-ollama
    restart: unless-stopped
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0

volumes:
  postgres_data:
  ollama_data: